<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Saurab Dhir</title>
<meta name="description" content="That page doesn't exist. Head back to saurabdhir.com.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf8f2;color:#17233a;font-family:'Schibsted Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
     min-height:100vh;display:flex;flex-direction:column}
a{color:#6f52e8}
a:hover{color:#5539d6}
::selection{background:#6f52e8;color:#fff}
header{padding:26px 40px}
.mark{font-family:'Silkscreen',monospace;font-size:15px;font-weight:700;letter-spacing:2px;color:#17233a;text-decoration:none}
.mark span{color:#6f52e8}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 40px 90px}
.wrap{width:100%;max-width:720px}
.eyebrow{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:3px;color:#6f52e8;margin:0 0 14px}
h1{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.08;margin:0 0 14px}
.sub{font-size:17px;line-height:1.5;color:#5c6474;margin:0 0 30px;max-width:46ch}
.scene{width:100%;border:2px solid #17233a;box-shadow:4px 4px 0 #17233a;display:block;background:#d8ebfa}
.actions{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:1.5px;text-decoration:none;padding:13px 20px;border:2px solid #17233a;
     background:#17233a;color:#faf8f2;box-shadow:4px 4px 0 rgba(23,35,58,.25);transition:transform .08s,box-shadow .08s}
.btn:hover{color:#fff;transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(23,35,58,.25)}
.btn.ghost{background:#faf8f2;color:#17233a;box-shadow:4px 4px 0 rgba(23,35,58,.12)}
.btn.ghost:hover{background:#fff;color:#17233a}
footer{padding:22px 40px;font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:2px;color:#8a93a8}
@media (max-width:640px){
  header,main,footer{padding-left:22px;padding-right:22px}
  h1{font-size:32px}
  .sub{font-size:15px}
}
</style>
</head>
<body>

<header><a class="mark" href="/">SD<span>&#9642;</span></a></header>

<main>
  <div class="wrap">
    <p class="eyebrow">ERROR 404</p>
    <h1>You've reached the edge of the map.</h1>
    <p class="sub">This page doesn't exist, or it moved somewhere better. Either way &mdash; nothing down there but sky.</p>

        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a9c9e4"/><stop offset="100%" stop-color="#e4f1fb"/>
        </linearGradient>
        <pattern id="teeth" width="16" height="8" patternUnits="userSpaceOnUse">
          <rect width="8" height="8" fill="#4a9b4f"/>
        </pattern>
      </defs>

      <rect width="560" height="216" fill="url(#sky)"/>

      <!-- clouds -->
      <g fill="#fff" opacity=".92">

      <g>
        <rect x="392" y="160" width="168" height="8" fill="url(#teeth)"/>

        <rect x="392" y="200" width="168" height="16" fill="#3b7c40"/>

        <rect x="259" y="100" width="6" height="6"/>
        <rect x="253" y="106" width="12" height="6"/>
        <rect x="247" y="112" width="6" height="6"/>
        <rect x="259" y="112" width="6" height="6"/>

        <rect x="241" y="124" width="30" height="6"/>
        <rect x="259" y="130" width="6" height="6"/>
        <rect x="259" y="136" width="6" height="6"/>
        <rect x="285" y="100" width="18" height="6"/>

        <rect x="303" y="106" width="6" height="6"/>
        <rect x="279" y="112" width="6" height="6"/>
        <rect x="303" y="112" width="6" height="6"/>
        <rect x="279" y="118" width="6" height="6"/>
        <rect x="303" y="118" width="6" height="6"/>
        <rect x="279" y="124" width="6" height="6"/>
        <rect x="303" y="124" width="6" height="6"/>
        <rect x="279" y="130" width="6" height="6"/>
        <rect x="303" y="130" width="6" height="6"/>
        <rect x="285" y="136" width="18" height="6"/>
        <rect x="335" y="100" width="6" height="6"/>
        <rect x="329" y="106" width="12" height="6"/>

      <!-- figure standing at the left edge, looking down -->
      <g>
        <!-- page / head -->
        <rect x="150" y="112" width="28" height="22" fill="#fff"/>
        <rect x="154" y="118" width="16" height="2" fill="#8a93a8"/>
        <rect x="154" y="123" width="20" height="2" fill="#8a93a8"/>

    <div class="actions">
      <a class="btn" href="/">&#8592; BACK TO SOLID GROUND</a>

<footer>SAURABDHIR.COM</footer>

</html>
